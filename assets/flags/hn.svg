<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="flag-hn" viewBox="0 0 640 480">
  <!--
    Honduras, in the navy blue the flag returned to in 2026.

    An override rather than an addition: `flag-icons` ships this flag in the turquoise
    (#18c3df) adopted in 2022, so unlike the two flags drawn from scratch in this folder,
    a file already exists for the code and `prepare-flags.mjs` has to be told explicitly
    to prefer this one.

    Only the colour differs. Every path, transform and `use` below is the library's own
    geometry, copied verbatim — the three equal bands and the five stars in their
    quincunx, at the same coordinates and the same scale — so nothing about how the flag
    is framed, fitted or clipped can shift as a result of this change.
  -->
  <path fill="#0d3b99" d="M0 0h640v480H0z"/>
  <path fill="#fff" d="M0 160h640v160H0z"/>
  <g id="hn-c" fill="#0d3b99" transform="translate(320 240)scale(26.66665)">
    <g id="hn-b">
      <path id="hn-a" d="m-.3 0 .5.1L0-1z"/>
      <use xlink:href="#hn-a" width="100%" height="100%" transform="scale(-1 1)"/>
    </g>
    <use xlink:href="#hn-b" width="100%" height="100%" transform="rotate(72)"/>
    <use xlink:href="#hn-b" width="100%" height="100%" transform="rotate(-72)"/>
    <use xlink:href="#hn-b" width="100%" height="100%" transform="rotate(144)"/>
    <use xlink:href="#hn-b" width="100%" height="100%" transform="rotate(-144)"/>
  </g>
  <use xlink:href="#hn-c" width="100%" height="100%" transform="translate(133.3 -42.7)"/>
  <use xlink:href="#hn-c" width="100%" height="100%" transform="translate(133.3 37.3)"/>
  <use xlink:href="#hn-c" width="100%" height="100%" transform="translate(-133.3 -42.7)"/>
  <use xlink:href="#hn-c" width="100%" height="100%" transform="translate(-133.3 37.3)"/>
</svg>
