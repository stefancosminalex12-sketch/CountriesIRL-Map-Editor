<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CountriesIRL Map Editor | Create Custom Maps</title>
    <meta
      name="description"
      content="Create and customize detailed world, regional, historical, and administrative maps with the CountriesIRL Map Editor."
    />
    <link rel="canonical" href="https://maps.countriesirl.com/" />

    <!-- Social sharing: the CountriesIRL card countriesirl.com already publishes. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CountriesIRL" />
    <meta property="og:title" content="CountriesIRL Map Editor | Create Custom Maps" />
    <meta
      property="og:description"
      content="Create and customize detailed world, regional, historical, and administrative maps with the CountriesIRL Map Editor."
    />
    <meta property="og:url" content="https://maps.countriesirl.com/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://countriesirl.com/assets/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The CountriesIRL logo above the words “The biggest countries network in the world.”"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CountriesIRL Map Editor | Create Custom Maps" />
    <meta
      name="twitter:description"
      content="Create and customize detailed world, regional, historical, and administrative maps with the CountriesIRL Map Editor."
    />
    <meta name="twitter:image" content="https://countriesirl.com/assets/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="The CountriesIRL logo above the words “The biggest countries network in the world.”"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "CountriesIRL Map Editor",
        "url": "https://maps.countriesirl.com/",
        "description": "Create and customize detailed world, regional, historical, and administrative maps with the CountriesIRL Map Editor.",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript and a modern web browser.",
        "inLanguage": "en",
        "image": "https://countriesirl.com/assets/og-image.png",
        "publisher": {
          "@type": "Organization",
          "name": "CountriesIRL",
          "url": "https://countriesirl.com/"
        }
      }
    </script>
  </head>
  <body>
    <!--
      The splash before the app has loaded: the same screen the app shows while a map loads
      (LoadingScreen), so the hand-over does not show. Dark when the saved theme is Dark. The app
      removes it once it is up.
    -->
    <div id="boot-splash" style="position:fixed;inset:0;z-index:3000;display:grid;place-items:center;background:#fefefc">
      <span style="display:block;width:min(72vmin,680px);aspect-ratio:800/832;background:#0b1624;-webkit-mask:url(/brand/logo-mask.png) center/contain no-repeat;mask:url(/brand/logo-mask.png) center/contain no-repeat"></span>
    </div>
    <script>
      try {
        if (JSON.parse(localStorage.getItem('map-editor.settings.v1') || '{}').themeId === 'dark') {
          var splash = document.getElementById('boot-splash')
          splash.style.background = '#0b1624'
          splash.firstElementChild.style.background = '#fefefc'
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
